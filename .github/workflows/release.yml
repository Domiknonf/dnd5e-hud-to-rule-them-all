name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp module.json
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          jq --arg v "$VERSION" --arg repo "$REPO" '
            .version = $v
            | .url      = "https://github.com/" + $repo
            | .manifest = "https://github.com/" + $repo + "/releases/latest/download/module.json"
            | .download = "https://github.com/" + $repo + "/releases/download/v" + $v + "/module.zip"
          ' module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Zip
        run: |
          zip -r module.zip module.json README.md LICENSE scripts templates styles lang

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            module.json
            module.zip
